<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輪読用抽選アプリ</title>
    <style>
        /* 1. 変数定義 */
        :root {
            --bg: rgb(249, 197, 132);
            --panel: #ffffff;
            --text: #4a3728;
            --accent: #e67e22;
            --secondary-btn: #d5a37e;
            --danger: #e74c3c;
            --muted: #8d7d70;
            --input-bg: #fffcf9;
            --input-border: #dcb084;
        }

        /* 2. 基本設定 */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            line-height: 1.5;
        }

        .container {
            max-width: 820px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #5d4037;
            text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5);
        }

        /* 3. レイアウト/パネル */
        .panel {
            background: var(--panel);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin: 0 0 20px 0;
            border-left: 5px solid var(--accent);
            padding-left: 12px;
            font-size: 1.25rem;
            color: #5d4037;
        }

        .description {
            font-size: 0.9rem;
            color: #6d5d50;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--input-border);
            margin: 25px 0;
            opacity: 0.5;
        }

        /* 4. 入力要素 */
        input,
        textarea,
        select {
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: var(--accent);
        }

        textarea {
            width: 100%;
            min-height: 100px;
            resize: vertical;
            margin-bottom: 10px;
        }

        /* 5. ボタン類 */
        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.85;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: var(--secondary-btn);
        }

        button.danger {
            background: var(--danger);
        }

        button.delete {
            background: transparent;
            color: var(--danger);
            font-size: 1.5rem;
            padding: 0;
        }

        #btnDraw {
            min-width: 160px;
            font-size: 1.1rem;
        }


        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        /* 6. リスト項目 */
        .item-list {
            margin: 20px 0;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr 100px 80px 40px;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
            padding: 8px;
            background: #fff9f2;
            border-radius: 10px;
        }

        .prob-display {
            font-size: 0.85rem;
            color: var(--muted);
            text-align: right;
            font-weight: bold;
        }

        /* 7. 抽選結果/タイマー表示 */
        .result-text {
            margin-top: 15px;
            padding: 20px;
            background: #fff4e6;
            border-radius: 12px;
            font-size: 1.4rem;
            font-weight: bold;
            color: #d35400;
            min-height: 1.6em;
            text-align: center;
            border: 2px dashed var(--input-border);
        }

        .timer-display {
            font-size: 4.5rem;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            color: #e67e22;
        }

        .timer-inputs {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .timer-inputs label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: bold;
        }

        .timer-sliders {
            max-width: 600px;
            margin: 0 auto 22px;
        }

        .timer-slider-row {
            display: grid;
            grid-template-columns: 48px 1fr 58px;
            gap: 12px;
            align-items: center;
            margin: 10px 0;
        }

        .timer-slider-row label {
            font-size: 0.9rem;
            color: var(--muted);
            font-weight: bold;
            text-align: right;
        }

        .timer-slider-row input[type="range"] {
            width: 100%;
            padding: 0;
            border: 0;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .timer-slider-value {
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            text-align: right;
            color: var(--text);
        }

        .timer-adjustments {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin: 0 0 22px;
        }

        .timer-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>輪読用抽選アプリ</h1>

        <section class="panel">
            <h2>抽選設定</h2>

            <div class="description">
                「重み」は相対的な当たりやすさを表します。<br>
                例えば、重みが 2 の項目は、重みが 1 の項目より
                <b>2 倍選ばれやすく</b>なります。<br>
                表示されている％は、現在の設定に基づく選択確率です。
            </div>

            <div class="description">
                項目を一括で入力する場合は、以下に 1 行 1 項目で入力してください。
            </div>

            <textarea id="bulkInput" placeholder="参加者名を入力..."></textarea>
            <button id="btnBulkAdd" class="secondary">一括追加</button>

            <hr>

            <div class="button-group">
                <button id="btnAddItem" class="secondary">＋ 項目追加</button>
            </div>

            <div id="itemsContainer" class="item-list"></div>

            <div style="text-align:center; margin-top:20px;">
                <button id="btnDraw">抽選を実行</button>
            </div>

            <div id="drawResult" class="result-text">準備完了</div>
        </section>

        <section class="panel">
            <h2>タイマー</h2>

            <div class="timer-inputs">
                <div>
                    <select id="selectMin"></select>
                    <label>分</label>
                </div>
                <div>
                    <select id="selectSec"></select>
                    <label>秒</label>
                </div>
            </div>

            <div class="timer-sliders">
                <div class="timer-slider-row">
                    <label for="sliderMin">分</label>
                    <input id="sliderMin" type="range" min="0" max="60" step="1" value="15"
                        aria-label="分をスライダーで設定">
                    <span id="sliderMinValue" class="timer-slider-value">15分</span>
                </div>
                <div class="timer-slider-row">
                    <label for="sliderSec">秒</label>
                    <input id="sliderSec" type="range" min="0" max="59" step="1" value="0"
                        aria-label="秒をスライダーで設定">
                    <span id="sliderSecValue" class="timer-slider-value">0秒</span>
                </div>
            </div>

            <div id="timerDisplay" class="timer-display">00:00</div>

            <div class="timer-adjustments">
                <button id="btnMinusMin" class="secondary">−1分</button>
                <button id="btnMinus10Sec" class="secondary">−10秒</button>
                <button id="btnMinus1Sec" class="secondary">−1秒</button>
                <button id="btnPlus1Sec" class="secondary">＋1秒</button>
                <button id="btnPlus10Sec" class="secondary">＋10秒</button>
                <button id="btnPlusMin" class="secondary">＋1分</button>
            </div>

            <div class="timer-actions">
                <button id="btnTimerStart">スタート</button>
                <button id="btnTimerStop" class="secondary">ストップ</button>
                <button id="btnTimerReset" class="danger">リセット / 音を止める</button>
                <button id="btnSet5" class="secondary">5分</button>
                <button id="btnSet25" class="secondary">25分</button>
            </div>
            <div class="description" style="text-align:center; margin-top:14px; margin-bottom:0;">
                アラーム：Mozart, <i>Eine kleine Nachtmusik</i>, K. 525，
                第1楽章・第1主題（第1–10小節，電子音）
            </div>
        </section>
    </div>

    <script>
        /**
         * 1. 定数・グローバル変数
         */
        const itemsContainer = document.getElementById('itemsContainer');
        const drawResult = document.getElementById('drawResult');
        const selectMin = document.getElementById('selectMin');
        const selectSec = document.getElementById('selectSec');
        const sliderMin = document.getElementById('sliderMin');
        const sliderSec = document.getElementById('sliderSec');
        const sliderMinValue = document.getElementById('sliderMinValue');
        const sliderSecValue = document.getElementById('sliderSecValue');

        let timerId = null;
        let timerLastTick = null;
        let remainingMs = 0;
        let alarmCtx = null;
        let alarmLoopTimeout = null;
        let alarmSession = 0;

        const ALARM_BPM = 148;
        const ALARM_EIGHTH_SEC = 30 / ALARM_BPM;
        const ALARM_LOOP_GAP_SEC = 0.8;

        // Mozart, Eine kleine Nachtmusik, K. 525, I. Allegro.
        // First subject (measures 1--10), encoded in eighth-note units.
        // The melody follows the public-domain Mutopia first-violin score.
        const ALARM_MAIN_THEME = [
            // m. 1
            ['G4', 2], [null, 1], ['D4', 1], ['G4', 2], [null, 1], ['D4', 1],
            // m. 2
            ['G4', 1], ['D4', 1], ['G4', 1], ['B4', 1], ['D5', 2], [null, 2],
            // m. 3
            ['C5', 2], [null, 1], ['A4', 1], ['C5', 2], [null, 1], ['A4', 1],
            // m. 4
            ['C5', 1], ['A4', 1], ['F#4', 1], ['A4', 1], ['D4', 2], [null, 2],
            // m. 5
            ['G4', 1], [null, 1], ['G4', 3], ['B4', 1], ['A4', 1], ['G4', 1],
            // m. 6
            ['G4', 1], ['F#4', 1], ['F#4', 3], ['A4', 1], ['C5', 1], ['F#4', 1],
            // m. 7
            ['A4', 1], ['G4', 1], ['G4', 3], ['B4', 1], ['A4', 1], ['G4', 1],
            // m. 8
            ['G4', 1], ['F#4', 1], ['F#4', 3], ['A4', 1], ['C5', 1], ['F#4', 1],
            // m. 9
            ['G4', 1], ['G4', 1], ['G4', 0.5], ['F#4', 0.5], ['E4', 0.5], ['F#4', 0.5],
            ['G4', 1], ['G4', 1], ['B4', 0.5], ['A4', 0.5], ['G4', 0.5], ['A4', 0.5],
            // m. 10
            ['B4', 1], ['B4', 1], ['D5', 0.5], ['C5', 0.5], ['B4', 0.5], ['C5', 0.5],
            ['D5', 2], [null, 2],
        ];

        /**
         * 2. 抽選ロジック
         */
        function createItemRow(name = '', weight = 3) {
            const row = document.createElement('div');
            row.className = 'item-row';
            row.innerHTML = `
                <input type="text" class="item-name" value="${name}" placeholder="名前">
                <input type="number" class="item-weight" value="${weight}" min="0">
                <div class="prob-display">0%</div>
                <button class="delete" title="削除">×</button>
            `;
            row.querySelector('.item-weight').addEventListener('input', updateProbabilities);
            row.querySelector('.delete').addEventListener('click', () => {
                row.remove();
                updateProbabilities();
            });
            return row;
        }

        function addItem(name = '', weight = 3) {
            itemsContainer.prepend(createItemRow(name, weight));
            updateProbabilities();
        }

        function updateProbabilities() {
            const rows = [...document.querySelectorAll('.item-row')];
            const totalWeight = rows.reduce((sum, row) => sum + (parseFloat(row.querySelector('.item-weight').value) || 0), 0);
            rows.forEach(row => {
                const w = parseFloat(row.querySelector('.item-weight').value) || 0;
                const percent = totalWeight > 0 ? ((w / totalWeight) * 100).toFixed(1) : 0;
                row.querySelector('.prob-display').textContent = `${percent}%`;
            });
        }

        function draw() {
            const rows = [...document.querySelectorAll('.item-row')];
            const pool = [];
            let totalWeight = 0;

            rows.forEach(row => {
                const name = row.querySelector('.item-name').value.trim();
                const weight = parseFloat(row.querySelector('.item-weight').value) || 0;
                if (name && weight > 0) {
                    pool.push({ name, weight });
                    totalWeight += weight;
                }
            });

            if (pool.length === 0) return;

            let random = Math.random() * totalWeight;
            let selected = "";
            for (const item of pool) {
                if (random < item.weight) {
                    selected = item.name;
                    break;
                }
                random -= item.weight;
            }

            const timeStr = new Date().toLocaleTimeString('ja-JP', { hour12: false });
            drawResult.textContent = `${selected} （抽選時刻：${timeStr}）`;
        }

        /**
         * 3. タイマー・アラームロジック
         */
        // プルダウン生成
        for (let i = 0; i <= 60; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            if (i === 15) opt.selected = true;
            selectMin.appendChild(opt);
        }
        for (let i = 0; i < 60; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            selectSec.appendChild(opt);
        }

        const MAX_TIMER_SECONDS = 60 * 60 + 59;

        function clampTimerSeconds(totalSec) {
            return Math.max(0, Math.min(MAX_TIMER_SECONDS, Math.round(totalSec)));
        }

        function configuredTimerSeconds() {
            return parseInt(selectMin.value) * 60 + parseInt(selectSec.value);
        }

        function updateTimerControls(totalSec) {
            const clamped = clampTimerSeconds(totalSec);
            const minutes = Math.floor(clamped / 60);
            const seconds = clamped % 60;

            selectMin.value = minutes;
            selectSec.value = seconds;
            sliderMin.value = minutes;
            sliderSec.value = seconds;
            sliderMinValue.textContent = `${minutes}分`;
            sliderSecValue.textContent = `${seconds}秒`;
        }

        function setTimerInputs(totalSec) {
            const clamped = clampTimerSeconds(totalSec);
            remainingMs = clamped * 1000;
            updateTimerControls(clamped);

            // If the duration is changed while the timer is running, start
            // measuring elapsed time from the moment of the change.
            if (timerId) {
                timerLastTick = Date.now();
            }

            updateTimerDisplay(remainingMs);
        }

        function syncControlsToRemainingTime() {
            updateTimerControls(Math.ceil(remainingMs / 1000));
            updateTimerDisplay(remainingMs);
        }

        function syncFromSelects() {
            setTimerInputs(configuredTimerSeconds());
        }

        function syncFromSliders() {
            const totalSec = parseInt(sliderMin.value) * 60 + parseInt(sliderSec.value);
            setTimerInputs(totalSec);
        }

        function adjustTimer(secondsDelta) {
            const baseSec = Math.ceil(remainingMs / 1000);
            setTimerInputs(baseSec + secondsDelta);
        }

        function updateTimerDisplay(ms) {
            const safeMs = Math.max(0, ms);
            const totalSec = Math.ceil(safeMs / 1000);
            const m = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            document.getElementById('timerDisplay').textContent =
                `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startTimer() {
            if (timerId) return;

            stopAlarm();

            // A zero-duration timer should remain stopped and must not create
            // an AudioContext unnecessarily.
            if (remainingMs <= 0) {
                setTimerInputs(configuredTimerSeconds());
            }
            if (remainingMs <= 0) return;

            // Create/resume the AudioContext from the user's Start click so
            // that the alarm can play when the countdown later reaches zero.
            prepareAlarmAudio();

            timerLastTick = Date.now();
            timerId = setInterval(() => {
                const now = Date.now();
                const delta = now - timerLastTick;
                timerLastTick = now;
                remainingMs = Math.max(0, remainingMs - delta);

                if (remainingMs <= 0) {
                    remainingMs = 0;
                    stopTimer();
                    startAlarm();
                    return;
                }

                updateTimerDisplay(remainingMs);
            }, 100);
        }

        function stopTimer() {
            if (timerId) {
                clearInterval(timerId);
                timerId = null;
            }
            timerLastTick = null;

            // When paused or completed, make the selectors and sliders match
            // the displayed remaining time. Keep sub-second precision in
            // remainingMs so that pause/resume does not add time.
            syncControlsToRemainingTime();
        }

        function resetTimer() {
            stopTimer();
            stopAlarm();
            setTimerInputs(0);
        }

        function prepareAlarmAudio() {
            if (!alarmCtx || alarmCtx.state === 'closed') {
                alarmCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (alarmCtx.state === 'suspended') {
                alarmCtx.resume().catch(error => {
                    console.error('オーディオを開始できませんでした:', error);
                });
            }
        }

        function noteToFrequency(note) {
            const match = /^([A-G])(#?)(\d)$/.exec(note);
            if (!match) return 0;

            const semitone = {
                C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11,
            }[match[1]] + (match[2] === '#' ? 1 : 0);
            const midi = 12 * (parseInt(match[3]) + 1) + semitone;
            return 440 * Math.pow(2, (midi - 69) / 12);
        }

        function scheduleElectronicNote(note, start, duration) {
            if (!alarmCtx || note === null) return;

            const frequency = noteToFrequency(note);
            const soundingDuration = Math.max(0.04, duration * 0.88);
            const attack = Math.min(0.008, soundingDuration * 0.12);
            const release = Math.min(0.045, soundingDuration * 0.25);
            const end = start + soundingDuration;

            // Square-wave lead: intentionally electronic and clearly audible.
            const lead = alarmCtx.createOscillator();
            const leadGain = alarmCtx.createGain();
            lead.type = 'square';
            lead.frequency.setValueAtTime(frequency, start);
            leadGain.gain.setValueAtTime(0, start);
            leadGain.gain.linearRampToValueAtTime(0.055, start + attack);
            leadGain.gain.setValueAtTime(0.055, Math.max(start + attack, end - release));
            leadGain.gain.linearRampToValueAtTime(0, end);
            lead.connect(leadGain);
            leadGain.connect(alarmCtx.destination);
            lead.start(start);
            lead.stop(end + 0.01);

            // Quiet triangle wave one octave lower gives the alarm a fuller synth sound.
            const sub = alarmCtx.createOscillator();
            const subGain = alarmCtx.createGain();
            sub.type = 'triangle';
            sub.frequency.setValueAtTime(frequency / 2, start);
            subGain.gain.setValueAtTime(0, start);
            subGain.gain.linearRampToValueAtTime(0.035, start + attack);
            subGain.gain.setValueAtTime(0.035, Math.max(start + attack, end - release));
            subGain.gain.linearRampToValueAtTime(0, end);
            sub.connect(subGain);
            subGain.connect(alarmCtx.destination);
            sub.start(start);
            sub.stop(end + 0.01);
        }

        function startAlarm() {
            if (alarmLoopTimeout) return;

            prepareAlarmAudio();
            const session = ++alarmSession;
            const phraseDuration = ALARM_MAIN_THEME.reduce(
                (sum, [, eighths]) => sum + eighths * ALARM_EIGHTH_SEC,
                0
            );

            const playTheme = () => {
                if (session !== alarmSession || !alarmCtx || alarmCtx.state === 'closed') return;

                const start = alarmCtx.currentTime + 0.03;
                let offset = 0;

                for (const [note, eighths] of ALARM_MAIN_THEME) {
                    const duration = eighths * ALARM_EIGHTH_SEC;
                    scheduleElectronicNote(note, start + offset, duration);
                    offset += duration;
                }

                alarmLoopTimeout = setTimeout(
                    playTheme,
                    (phraseDuration + ALARM_LOOP_GAP_SEC) * 1000
                );
            };

            playTheme();
        }

        function stopAlarm() {
            alarmSession++;

            if (alarmLoopTimeout) {
                clearTimeout(alarmLoopTimeout);
                alarmLoopTimeout = null;
            }

            if (alarmCtx) {
                alarmCtx.close();
                alarmCtx = null;
            }
        }

        /**
         * 4. イベント登録
         */
        document.getElementById('btnBulkAdd').addEventListener('click', () => {
            const input = document.getElementById('bulkInput');
            input.value.split('\n')
                .map(s => s.trim())
                .filter(Boolean)
                .forEach(name => addItem(name));
            input.value = '';
        });

        document.getElementById('btnSet5').addEventListener('click', () => {
            setTimerInputs(5 * 60);
        });

        document.getElementById('btnSet25').addEventListener('click', () => {
            setTimerInputs(25 * 60);
        });

        selectMin.addEventListener('change', syncFromSelects);
        selectSec.addEventListener('change', syncFromSelects);
        sliderMin.addEventListener('input', syncFromSliders);
        sliderSec.addEventListener('input', syncFromSliders);

        function adjustTimerFromButton(secondsDelta) {
            const wasRunning = Boolean(timerId);
            adjustTimer(secondsDelta);

            if (wasRunning && remainingMs <= 0) {
                stopTimer();
                startAlarm();
            }
        }

        document.getElementById('btnMinusMin').addEventListener('click', () => adjustTimerFromButton(-60));
        document.getElementById('btnMinus10Sec').addEventListener('click', () => adjustTimerFromButton(-10));
        document.getElementById('btnMinus1Sec').addEventListener('click', () => adjustTimerFromButton(-1));
        document.getElementById('btnPlus1Sec').addEventListener('click', () => adjustTimerFromButton(1));
        document.getElementById('btnPlus10Sec').addEventListener('click', () => adjustTimerFromButton(10));
        document.getElementById('btnPlusMin').addEventListener('click', () => adjustTimerFromButton(60));

        document.getElementById('btnAddItem').addEventListener('click', () => addItem());
        document.getElementById('btnDraw').addEventListener('click', draw);
        document.getElementById('btnTimerStart').addEventListener('click', startTimer);
        document.getElementById('btnTimerStop').addEventListener('click', () => {
            stopTimer();
            stopAlarm();
        });
        document.getElementById('btnTimerReset').addEventListener('click', resetTimer);

        // 初期状態
        setTimerInputs(15 * 60);
        addItem('参加者A');
    </script>
</body>

</html>
